[project]
name = "weather-mcp"
version = "0.1.0"
description = "Production-ready MCP server providing real-time weather data, forecasts, and weather report generation using NOAA/NWS and OpenStreetMap APIs"
requires-python = ">=3.11"
authors = [{name = "Wes Jackson", email = "wjackson@redhat.com"}]
readme = "README.md"
license = {text = "MIT"}
keywords = ["mcp", "weather", "noaa", "nws", "fastmcp", "llm", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "fastmcp>=2.11.3",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.1.1",
  "python-dateutil>=2.9.0",
  "watchdog>=6.0.0",
  "pytest>=8.4.1",
  "pyjwt>=2.10.1",
]

[project.urls]
"Homepage" = "https://github.com/your-org/weather-mcp"
"Documentation" = "https://github.com/your-org/weather-mcp/blob/main/README.md"
"Bug Tracker" = "https://github.com/your-org/weather-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
weather-mcp = "src.main:main"
weather-mcp-server = "src.main:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
